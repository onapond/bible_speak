name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY bible-speak
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/master' &&
      inputs.confirmation == 'DEPLOY bible-speak'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bible-speak.web.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: flutter pub get --enforce-lockfile
      - run: npm --prefix functions ci
      - name: Run the full harness and deploy only to production
        env:
          BIBLE_SPEAK_PROD_CONFIRM: bible-speak
        run: ./scripts/deploy_environment.sh production web
