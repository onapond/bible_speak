name: Environment Contract

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: environment-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Verify environment mapping and harness gates
        run: ./scripts/check_environment_contract.sh
      - name: Verify Functions
        working-directory: functions
        run: |
          npm ci
          npm test

  flutter:
    name: flutter-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  deploy-development:
    name: deploy-development
    needs: [boundary, flutter]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://bible-speak-dev.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: flutter pub get
      - name: Build development web app
        run: ./build_web.sh development
      - name: Deploy only to the development Firebase project
        run: >-
          npx --yes firebase-tools@15.28.1 deploy
          --project bible-speak-dev
          --only hosting,firestore:rules
