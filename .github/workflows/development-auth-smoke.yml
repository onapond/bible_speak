name: Development Auth Smoke

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SMOKE bible-speak-dev
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-development-auth-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.ref == 'refs/heads/develop' &&
      inputs.confirmation == 'SMOKE bible-speak-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm --prefix functions ci
      - name: Smoke-test development Auth and Firestore rules
        env:
          FIREBASE_PROJECT_ID: bible-speak-dev
          FIREBASE_WEB_API_KEY: AIzaSyAl9RP80Gx_y1nq15EbTeYAVOIrP6x5SR8
        run: node functions/development_auth_smoke.mjs
