workflows:
  # 개발 iOS TestFlight 배포
  ios-testflight:
    name: iOS Development TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.onapond.biblespeak
      vars:
        BUNDLE_ID: "com.onapond.biblespeak"
      flutter: 3.47.1
      xcode: 26.6
      cocoapods: 1.17.0

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true

    scripts:
      - name: Set up code signing
        script: |
          keychain initialize

      - name: Get Flutter packages
        script: flutter pub get --enforce-lockfile

      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --no-pub \
            --dart-define=APP_ENV=development \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  # 개발 Android Play Store Internal 배포
  android-playstore:
    name: Android Development Internal
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      android_signing:
        - bible_speak_keystore
      groups:
        - google_play
      vars:
        BUNDLE_ID: "com.onapond.biblespeak"
      flutter: 3.47.1
      java: 21

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get --enforce-lockfile

      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos

      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --no-pub \
            --dart-define=APP_ENV=development \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
