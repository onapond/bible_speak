name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY bible-speak
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/master' &&
      inputs.confirmation == 'DEPLOY bible-speak'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bible-speak.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: flutter pub get
      - name: Verify production source
        run: |
          test "$(git branch --show-current)" = master
          ./scripts/check_environment_contract.sh
          flutter analyze --no-fatal-infos
          flutter test
          npm --prefix functions ci
          npm --prefix functions test
      - name: Build production web app
        run: ./build_web.sh production
      - name: Deploy only to the production Firebase project
        run: >-
          npx --yes firebase-tools@15.28.1 deploy
          --project bible-speak
          --only hosting,firestore:rules
